name: Set up Nix
description: >-
  Install Nix and, when a cache name is provided, configure the Cachix binary
  cache. Pushes require an auth token and an event other than pull_request;
  pull_request runs, including fork pull requests, are pull-only.

# Copy this directory to <repo>/.github/actions/nix-setup/ verbatim.
# This mirrors nerima-lisp/.github/templates/actions/nix-setup. Update the
# nix-installer and cachix-action pins here; they apply to workflows that
# call this local action.
# Unlike the template's one-cache-per-repo convention, nerima-games callers
# pass one shared Cachix cache (`takeokunn-nerima-games`). Org convention keeps
# devShells nixpkgs-only, so package store paths are shared without
# repository-specific build outputs.

# NOTE: `actions/checkout` intentionally lives in the caller, not here: a
# local composite action cannot check the repository out, because its own
# action.yml is not on disk until after checkout has run.

inputs:
  cachix-cache:
    description: Cachix cache name. When empty, Cachix is not configured at all.
    required: false
    default: ""
  cachix-auth-token:
    description: >-
      Cachix auth token (pass secrets.CACHIX_AUTH_TOKEN). With a cache name,
      this enables pushes on event types other than pull_request. The exact
      pull_request event, including fork pull requests, remains pull-only.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    - name: Resolve Cachix mode
      id: cachix-mode
      shell: bash
      env:
        CACHIX_AUTH_TOKEN: ${{ inputs.cachix-auth-token }}
        CACHIX_CACHE: ${{ inputs.cachix-cache }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        push=false
        if [[ -n "$CACHIX_AUTH_TOKEN" && "$EVENT_NAME" != "pull_request" ]]; then
          push=true
        fi
        printf 'push=%s\n' "$push" >> "$GITHUB_OUTPUT"
        if [[ -z "$CACHIX_CACHE" ]]; then
          echo "::warning::CACHIX_CACHE is unset; building without a binary cache"
        fi

    - name: Configure Cachix (pull-only)
      if: ${{ inputs.cachix-cache != '' && steps.cachix-mode.outputs.push != 'true' }}
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: ${{ inputs.cachix-cache }}
        skipPush: true

    - name: Configure Cachix (push-enabled)
      if: ${{ inputs.cachix-cache != '' && steps.cachix-mode.outputs.push == 'true' }}
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-auth-token }}
