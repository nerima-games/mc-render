name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Pinned to a commit, not the mutable v6 tag (SUPPLY_CHAIN.md
        # "アクションの固定"): a tag can be repointed at new code without any
        # change here. persist-credentials: false keeps GITHUB_TOKEN out of
        # .git/config for every step after this one; this job needs no push
        # access.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `pnpm changeset status --since=origin/main` below needs the full
          # history to diff against origin/main; the default shallow clone
          # only has HEAD.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Configure GitHub Packages authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        # --ignore-scripts: a fork PR can edit package.json and the lockfile
        # consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a
      # package.json devDependency -- a single Nix-pinned version replaces
      # 16 repos each independently drifting on their own npm-resolved
      # oxlint version. Copy templates/actions/nix-setup to
      # <repo>/.github/actions/nix-setup/ verbatim; do not inline these
      # steps here.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # oxlint's no-restricted-imports (.oxlintrc.json) is the enforcement
      # mechanism for the Tier2 dependency policy (DEPENDENCY_POLICY.md §5).
      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: pnpm test

      - name: Changeset status
        # Detects a user-facing PR that forgot to add a .changeset/*.md file
        # (RELEASE_STANDARD.md §1.2). Does not gate push-to-main, only PRs.
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

      # Hard gate (TEST_STANDARD.md §3): statements/branches/functions/lines
      # all >= 100%. `vitest run --coverage` exits non-zero on its own when a
      # threshold is missed, so no extra scripting is needed here.
      - name: Coverage
        run: pnpm test:coverage

      - name: Package
        run: pnpm pack:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
