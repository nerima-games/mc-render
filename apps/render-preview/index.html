<!doctype html>
<!--
  THE RENDER PREVIEW. A generated fixture rendered in Chromium using SwiftShader WebGL.

  Adapted from mc-compose's `apps/render-preview`. `main.ts` imports
  mc-render's source modules so the fixture exercises this package's render path.

  This page fetches `terrain-fixture.json`, pre-generated terrain data. It
  exercises mc-render's render path without invoking worldgen at runtime.
  `pnpm test:browser` separately covers the browser runtime.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mc-render — fixture chunk preview</title>
    <style>
      body {
        margin: 0;
        background: #14161c;
        color: #d8dee9;
        font: 13px/1.5 ui-monospace, monospace;
      }
      #preview-canvas {
        display: block;
        width: 640px;
        height: 360px;
      }
      #preview-report {
        padding: 0.75rem;
        margin: 0;
      }
      #presentation-links {
        color: #b9e3f4;
        padding: 0 0.75rem 0.75rem;
      }
      #presentation-links a {
        color: inherit;
      }
    </style>
  </head>
  <body data-render-preview="running">
    <canvas id="preview-canvas"></canvas>
    <pre id="preview-report">drawing…</pre>
    <p id="presentation-links">
      <a href="?presentation=1">Show selection, mining, first-person and damage feedback</a>
      ·
      <a href="?presentation=sky">Show sun and clouds</a>
      ·
      <a href="?presentation=stars">Show moon and stars</a>
    </p>
  <script type="module" src="./main.ts"></script>
  </body>
</html>
